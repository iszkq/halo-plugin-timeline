# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: timeline
spec:
  enabled: true
  requires: ">=2.22.0"
  author:
    name: 恪勤
    website: /
  logo: logo.svg
  homepage: /
  repo: https://github.com/iszkq/halo-plugin-timeline
  issues: https://github.com/iszkq/halo-plugin-timeline/issues
  displayName: "时间轴"
  description: "为 Halo2 提供时间轴组件、横向/竖向/交替布局，可在编辑器中灵活插入"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/Handsome/timeline/blob/main/LICENSE"
